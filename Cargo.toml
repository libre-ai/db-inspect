[package]
name = "db-inspect"
version = "0.1.0-alpha.7"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/libre-ai/db-inspect"
description = "SQL and database security inspection for Postgres, pgvector, RLS, grants, and migrations."

[dependencies]
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlparser = "0.62.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
