name: Release

# Builds the pinned-release CI binary consumed by satellite db-inspection
# gates. The tarball sha256 is printed in the log and recorded in the release
# notes so consumers can pin it fail-closed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Ensure Rust toolchain satisfies rust-version
        run: rustup update --no-self-update stable

      - name: Build release binary (locked)
        run: cargo build --release --locked

      - name: Package tarball and print sha256
        run: |
          set -euo pipefail
          tar -czf db-inspect-x86_64-unknown-linux-gnu.tar.gz \
            -C target/release db-inspect
          shasum -a 256 db-inspect-x86_64-unknown-linux-gnu.tar.gz

      - name: Create GitHub release with pinned checksum in notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(shasum -a 256 db-inspect-x86_64-unknown-linux-gnu.tar.gz \
            | cut -d' ' -f1)"
          gh release create "$GITHUB_REF_NAME" \
            db-inspect-x86_64-unknown-linux-gnu.tar.gz \
            --notes "sha256: $sha"
