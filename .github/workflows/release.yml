name: Release

# Builds the pinned-release CI binary consumed by satellite db-inspection
# gates. The tarball sha256 is printed in the log and recorded in the release
# notes so consumers can pin it fail-closed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default; only the job that creates the GitHub release
# raises it to `write`. The gate that decides whether a release may exist runs
# with a read-only token and cannot publish anything itself.
permissions:
  contents: read

jobs:
  # Branch protection never applies to tags, and a tag can point at any commit:
  # the `pull_request` gates in ci.yml therefore prove nothing about the commit
  # a release is cut from. This job re-runs the suite on the exact tagged tree
  # and the publishing job below cannot start without it. fmt and clippy stay
  # out on purpose — they gate what may merge, not what may ship; a style lint
  # is not a reason to refuse a correct binary.
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No `dtolnay/rust-toolchain` here, unlike ci.yml: the runner already
      # ships rustup, and invoking a proxy installs and selects the toolchain
      # named by rust-toolchain.toml — so 1.97.0 is named once, in that file.
      # This job leans on that automatic install, which has a history worth
      # naming: 1.28.0 stopped installing the active toolchain implicitly, and
      # 1.28.1 restored it as the default with `RUSTUP_AUTO_INSTALL=0` as the
      # opt-out (1.29.0 added `rustup set auto-install disable` alongside it).
      # `ubuntu-latest` resolves to ubuntu-24.04, whose image ships rustup
      # 1.29.0, so the install happens. Were it ever disabled, the failure is
      # fail-closed rather than silent: the proxy errors that the toolchain is
      # not installed, this step fails, and `needs: test` keeps the publishing
      # job from starting.
      - name: Install and report the toolchain pinned by rust-toolchain.toml
        run: |
          set -euo pipefail
          cargo --version --verbose
          rustup show active-toolchain

      - run: cargo test --locked --all-features

  release:
    name: Build and publish release tarball
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Same rustup proxy install as the test job above, with the same
      # fail-closed failure mode. Reporting the result records in the release
      # log which toolchain produced the tarball that consumers pin by sha256.
      # This step previously ran `rustup update --no-self-update stable`: now
      # that rust-toolchain.toml exists, that installed a toolchain the build
      # does not use, and left the workflow reading as if it built on stable.
      - name: Install and report the toolchain pinned by rust-toolchain.toml
        run: |
          set -euo pipefail
          cargo --version --verbose
          rustup show active-toolchain

      - name: Build release binary (locked)
        run: cargo build --release --locked

      - name: Package tarball and print sha256
        run: |
          set -euo pipefail
          tar -czf db-inspect-x86_64-unknown-linux-gnu.tar.gz \
            -C target/release db-inspect
          shasum -a 256 db-inspect-x86_64-unknown-linux-gnu.tar.gz

      - name: Create GitHub release with pinned checksum in notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(shasum -a 256 db-inspect-x86_64-unknown-linux-gnu.tar.gz \
            | cut -d' ' -f1)"
          gh release create "$GITHUB_REF_NAME" \
            db-inspect-x86_64-unknown-linux-gnu.tar.gz \
            --notes "sha256: $sha"
